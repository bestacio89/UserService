name: .NET CI

on:
  push:
    branches:
      - develop
      - "fix/**"
      - "feat/**"
      - "chore/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore UserService.sln

      - name: Build solution
        run: dotnet build UserService.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run test suite
        run: >
          dotnet test UserService.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
